<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav>

            <h2 class="logo">Bhairavi</h2>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>
    </header>


    <!-- Contact Section -->
    <section id="contact">

        <h1 class="section-title">Contact Me</h1>

        <p>
            Feel free to contact me for any opportunities,
            projects or collaborations.
        </p>


        <!-- Contact Form -->
        <div class="contact-form">

            <form>

                <input
                    type="text"
                    name="name"
                    placeholder="Your Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Your Email"
                    required
                >

                <input
                    type="text"
                    name="subject"
                    placeholder="Subject"
                    required
                >

                <textarea
                    name="message"
                    rows="6"
                    placeholder="Your Message"
                    required
                ></textarea>

                <button type="submit" class="btn">
                    Send Message
                </button>

            </form>

        </div>


        <!-- Contact Information -->
        <div class="contact-info">

            <p>
                📧 Email:
                <strong>bhairavi@example.com</strong>
            </p>

            <p>
                📍 Location:
                <strong>Maharashtra, India</strong>
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 Bhairavi Patil. All Rights Reserved.</p>
    </footer>


    <script src="script.js"></script>
